const englishTypeNames={all:'すべて',meaning:'英文読解',vocab:'単語',blank:'穴埋め',grammar:'文法',talk:'英会話',listen:'リスニング'};
const englishLevelNames={easy:'初級',normal:'中級',hard:'上級'};
if(!['easy','normal','hard'].includes(state.englishLevel))state.englishLevel='normal';

function showEnglishSettings(){const level=state.englishLevel,type=state.englishType;modal('📚 英語の設定',`<p>難易度と問題の種類を選ぼう！設定は自動セーブされ、ボス戦・捕獲・英語クエストすべてに反映されます。</p><p><b>🎯 難易度</b></p>${Object.entries(englishLevelNames).map(([k,v])=>btn((level===k?'✅ ':'')+v,'setEnglishLevel('+JSON.stringify(k)+')')).join('')}<p><b>🧩 問題の種類</b></p>${Object.entries(englishTypeNames).map(([k,v])=>btn((type===k?'✅ ':'')+v,'setEnglishType('+JSON.stringify(k)+')')).join('')}<p class="small">🔊 リスニングでは問題文を音声で聞いて答えます。音声が使えない端末では「英文を見る」で確認できます。</p>${btn('閉じる','closeGameModal()')}`)}
function setEnglishLevel(v){if(!englishBank[v])return;state.englishLevel=v;persist();showEnglishSettings()}
function setEnglishType(v){if(!Object.hasOwn(englishTypeNames,v))return;state.englishType=v;persist();showEnglishSettings()}
function pickTask(){let pool=englishBank[state.englishLevel]||englishBank.normal;if(state.englishType!=='all')pool=pool.filter(t=>t[0]===state.englishType);if(!pool.length)pool=englishBank.normal;let candidates=pool.filter(t=>t[1]!==lastQuestionKey);let t=(candidates.length?candidates:pool)[Math.floor(Math.random()*(candidates.length||pool.length))];lastQuestionKey=t[1];return {kind:t[0],q:t[1],ask:t[2],opts:t[3],ans:t[4],jp:t[5]}}
function quiz(callback){question=pickTask();answered=false;renderQuiz(callback);if(question.kind==='listen')setTimeout(()=>{if(active&&question&&question.kind==='listen')speak(question.q)},180)}
function renderQuiz(callback,feedback=''){let t=question,listen=t.kind==='listen';let qView=listen?`<p>🔊 音声を聞いて答えてね</p>${btn('🔊 もう一度聞く','speak(question.q)')}${btn('👀 英文を見る','document.getElementById("heardText").style.display="block"')}<p id="heardText" style="display:none">${t.q}</p>`:`<p style="font-size:19px">${t.q}</p>${btn('🔊 英語を聞く','speak(question.q)')}`;modal('🎧 英語チャレンジ',`<p class="small">${englishLevelNames[state.englishLevel]} ・ ${englishTypeNames[t.kind]}</p>${qView}${btn('💡 ヒントを見る','document.getElementById("translation").style.display="block"')}<p id="translation" style="display:none;color:#b8edc3">${t.jp}</p><p><b>${t.ask}</b></p>${t.opts.map((o,i)=>btn((i+1)+'. '+o,'checkAnswer('+i+')')).join('')}<p class="small">${feedback}</p>`);window.quizDone=callback}
function checkAnswer(i){if(answered)return;if(i===question.ans){answered=true;window.quizDone(true)}else{sayToast('もう一度考えてみよう！');if(question.kind==='listen')speak(question.q)}}
function startBattle(e){battle={e,enemyHp:22+Math.floor(rand()*18),max:40};battle.max=battle.enemyHp;battleScreen()}function battleScreen(message=''){if(!battle)return;let t=types[battle.e.id],p=state.party[0];modal('⚔️ 野生の'+t.name,`<div style="text-align:center">${monsterPanelArt(battle.e.id)}</div><p>敵HP ${Math.max(0,battle.enemyHp)} / ${battle.max}<br>味方 ${types[p.id].name} HP ${p.hp} / ${p.maxhp}</p><p>${message}</p>${btn('🎧 英語を聞いて攻撃','attack()')}${btn('🔮 捕獲玉を投げる（残り '+state.balls+' 個）','capture()')}${btn('🏃 逃げる','closeGameModal()')}`)}function attack(){quiz(ok=>{if(!battle)return;let p=state.party[0];battle.enemyHp-=p.level*3+12;speak('Great job!');if(battle.enemyHp<=0){winBattle();return}p.hp=Math.max(1,p.hp-4);battleScreen('正解！攻撃成功！敵も反撃してきた。')})}function winBattle(){let p=state.party[0],e=battle.e;e.alive=false;p.xp+=15;state.coins+=12;state.wins++;if(p.xp>=p.level*25){p.xp=0;p.level++;p.maxhp+=5;p.hp=p.maxhp;if(p.level>=4&&!p.evolved){p.evolved=true;sayToast('✨ '+types[p.id].evo+' に進化！')}}persist();modal('🎉 勝利！',`<p>経験値 +15、コイン +12！</p><p>${p.evolved?'✨ '+types[p.id].evo+' に進化している！':''}</p>${btn('冒険に戻る','closeGameModal()')}`)}function capture(){if(state.balls<=0){sayToast('捕獲玉がない！町の商人へ');return}state.balls--;persist();quiz(ok=>{if(!battle)return;let chance=battle.enemyHp/battle.max<.5?.95:.75;if(Math.random()<chance){let e=battle.e;e.alive=false;let mon=makeMon(e.id);state.party.push(mon);persist();modal('🎊 捕獲成功！',`<div style="text-align:center">${monsterPanelArt(e.id)}</div><p>${types[e.id].name} が仲間になった！</p>${btn('冒険に戻る','closeGameModal()')}`)}else battleScreen('惜しい！モンスターが捕獲玉から抜け出した！')})}function npc(e){if(e.name==='先生'){modal('👩‍🏫 町の先生',`<p>"Welcome to Monster World!"</p>${btn('🔊 英語を聞く',"speak('Welcome to Monster World! Let us explore together!')")}${btn('英語クエストに挑戦','teacherQuiz()')}${btn('閉じる','closeGameModal()')}`)}else if(e.name==='商人'){modal('🧑‍💼 商人',`<p>"Would you like to buy a capture ball?"</p><p>捕獲玉1個：20コイン</p>${btn('🔊 英語を聞く',"speak('Would you like to buy a capture ball?')")}${btn('捕獲玉を買う','buyBall()')}${btn('閉じる','closeGameModal()')}`)}else if(e.name!=='旅人'){const lines={'雪原の研究者':['The snow is deeper near the mountains.','山の近くは雪が深いよ'],'火山の守り人':['Stay away from the hot lava.','熱い溶岩には近づかないで'],'遺跡の考古学者':['These ruins are very old.','この遺跡はとても古い'],'道案内人':['Follow the road to explore new places.','道を進んで新しい場所を探検しよう'],'宝石研究員':['These crystals shine at night.','この結晶は夜に光ります'],'キノコ博士':['Some mushrooms are taller than trees.','木より高いキノコもあるよ'],'砂漠の旅人':['Remember to bring enough water.','十分な水を持っていってね'],'花畑の園芸家':['The flowers bloom in the sunshine.','花は日光を浴びて咲くよ']};const line=lines[e.name]||['Welcome!','ようこそ'];modal(e.icon+' '+e.name,`<p>“${line[0]}”</p><p class="small">${line[1]}</p>${btn('🔊 英語を聞く',`speak(${JSON.stringify(line[0])})`)}${btn('英語クエストに挑戦','teacherQuiz()')}${btn('閉じる','closeGameModal()')}`)}else{modal('🧑‍🦱 旅人',`<p>"The forest is to the east. Be careful!"</p>${btn('🔊 英語を聞く',"speak('The forest is to the east. Be careful!')")}${btn('英語を練習する','teacherQuiz()')}${btn('閉じる','closeGameModal()')}`)}}function teacherQuiz(){quiz(()=>{state.coins+=10;state.quests++;let p=state.party[0];p.xp+=8;if(p.xp>=p.level*25){p.xp=0;p.level++;p.maxhp+=5;p.hp=p.maxhp;if(p.level>=4&&!p.evolved){p.evolved=true;sayToast('✨ '+types[p.id].evo+' に進化！')}}persist();modal('🌟 クエスト達成！',`<p>英語の練習に成功！10コインと経験値8を獲得。</p>${btn('戻る','closeGameModal()')}`)})}function buyBall(){if(state.coins<20){sayToast('コインが足りない！');return}state.coins-=20;state.balls++;persist();npc(entities[1])}function showParty(){modal('🐾 モンスター図鑑・仲間',state.party.map((m,i)=>`<p>${monsterArt(m.id,m.evolved)} <b>${m.evolved?types[m.id].evo:types[m.id].name}</b> Lv.${m.level} HP ${m.hp}/${m.maxhp} EXP ${m.xp}/${m.level*25}</p>${i?btn('先頭にする','lead('+i+')'):''}${!i?'<p class=small>乗り物：'+(mountMode(m)==='fly'?'空を飛ぶ':mountMode(m)==='swim'?'水を渡る':mountMode(m)==='run'?'速く走る':'進化後に解放')+'</p>':''}`).join('')+btn('閉じる','closeGameModal()'))}function lead(i){if(mounted){mounted=false;updateRideButton()}state.party.unshift(state.party.splice(i,1)[0]);persist();renderWorld();updateRideButton();showParty()}function showBag(){modal('🎒 持ち物',`<p>🪙 コイン：${state.coins}</p><p>🔮 捕獲玉：${state.balls}</p><p>🏆 勝利数：${state.wins}</p><p>📖 英語クエスト：${state.quests}</p><p>🗺️ 発見したエリア：${state.discovered.length}</p>${btn('閉じる','closeGameModal()')}`)}function showHelp(){modal('🗺️ 遊び方',`<p>方向ボタンで広い世界を自由に移動。PCでは矢印キーやWASDを使えます。</p><p>野生モンスターに触れるとバトル！「調べる」で近くの人と会話できます。</p><p>英語を聞き、正しい意味を選ぶと攻撃・捕獲できます。仲間はレベル4で進化します。</p><p>Ver.15では3章の物語と3体の地域ボスが追加されました。「📜 物語」で進行を確認し、ボスに近づいて「調べる」で英語バトルに挑めます。Ver.14では町にショップ・回復センター・研究所ができました。建物の入口に近づいて「調べる」を押すと中に入れます。新エリア発見の報酬は1つの表示に統一しました。Ver.13では主人公とモンスターが立体モデルになり、歩行・飛行の動きが加わりました。Ver.10では進化した先頭の仲間に『乗る』ボタンで乗れます。フレミィとサンバードは飛行、アクアは水上移動、その他は高速走行。水や崖の上では降りられません。乗っている間は野生モンスターとの戦闘も発生します。Ver.9では先頭の仲間が主人公の後ろを歩きます。仲間一覧から先頭を変更できます。草むらの演出は草原や森など草のある場所だけに表示されます。進化するとモンスターの体や輪郭も大きく変わります。<\/p><p>Ver.7ではクリスタル渓谷・キノコの森・砂漠・花畑も探検できます。橋や階段も通れます。崖と水は通れませんが橋と階段は通れます。</p><p>町の商人から捕獲玉を買えます。新エリア発見で15コイン獲得。右上のミニマップも活用しよう。自動セーブ対応。</p>${btn('閉じる','closeGameModal()')}`)}
